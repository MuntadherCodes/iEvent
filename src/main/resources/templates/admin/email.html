<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title th:text="'Email to ' + ${email.toEmail} + ' · super admin'">Email · super admin</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="min-h-screen bg-ink-50 font-body text-ink-800">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<header class="flex h-16 items-center justify-between border-b border-ink-100 bg-ink-900 px-6">
  <p class="font-display text-base font-extrabold text-white"><span class="text-brand-400">i</span>Event <span class="ms-1 rounded-md bg-white/10 px-2 py-0.5 text-xs font-semibold uppercase tracking-wide text-ink-200">Super admin</span></p>
  <form th:action="@{/admin/logout}" method="post">
    <button type="submit" class="text-sm font-semibold text-ink-300 transition hover:text-white">Sign out</button>
  </form>
</header>
<nav th:replace="~{admin/parts :: nav('emails')}"></nav>

<!-- R44: one email that was sent from the console, in full. The person's own answer to
     it arrives in the support mailbox, not on this page. -->
<main class="mx-auto max-w-3xl px-6 py-10">
  <a th:href="@{/admin/emails}" class="text-sm font-semibold text-ink-500 transition hover:text-brand-600">&larr; Sent emails</a>

  <div class="mt-3 min-w-0">
    <h1 id="sentEmailSubject" dir="auto" class="break-words font-display text-2xl font-extrabold tracking-tight text-ink-900" th:text="${email.subject}">Subject</h1>
    <p class="mt-1 break-words text-sm text-ink-500">
      To <bdi th:if="${email.toName != ''}" class="font-semibold text-ink-700" th:text="${email.toName}">Recipient name</bdi>
      <a th:href="'mailto:' + ${email.toEmail}" id="sentEmailTo" class="font-semibold text-brand-600 hover:underline" th:text="${email.toEmail}">recipient@email.com</a>
      · Sent <span id="sentEmailWhen" th:text="${email.sentLine}">Jan 1, 2026, 9:30 AM</span>
    </p>
    <p class="mt-1 break-words text-xs text-ink-400">Laid out in <span th:text="${email.langLabel}">Arabic</span>. If they answer, it arrives in <span th:text="${supportEmail}">support@example.com</span>, not on this page.</p>
  </div>

  <div class="mt-6 rounded-2xl border border-ink-100 bg-white p-6">
    <p class="text-xs font-semibold uppercase tracking-wide text-ink-400">Your message</p>
    <p id="sentEmailBody" dir="auto" class="mt-2 whitespace-pre-line break-words leading-relaxed text-ink-800" th:text="${email.body}">The full message.</p>
  </div>

  <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2">
    <a id="writeAgainLink" th:href="@{/admin/emails/new(to=${email.toEmail},name=${email.toName})}" class="inline-flex items-center gap-2 rounded-xl border border-ink-200 bg-white px-4 py-2.5 text-sm font-semibold text-ink-700 transition hover:border-brand-400 hover:text-brand-600"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-mail"/></svg>Write to them again</a>
    <a th:href="@{/admin/buyers(q=${email.toEmail})}" class="text-sm font-semibold text-brand-600 hover:underline">Look up their orders</a>
  </div>
</main>
</body>
</html>
