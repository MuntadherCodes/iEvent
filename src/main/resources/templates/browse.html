<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse events — iEvent')}"></head>
<body class="bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('browse')}"></th:block>

<main id="main">

  <!-- ============ PAGE HERO ============ -->
  <section class="border-b border-ink-100 bg-brand-50/60">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 md:py-10 lg:px-8">
      <nav class="text-sm text-ink-500" aria-label="Breadcrumb">
        <ol class="flex flex-wrap items-center gap-1.5">
          <li><a th:href="@{/}" class="transition hover:text-brand-600">Home</a></li>
          <li aria-hidden="true"><svg class="h-3.5 w-3.5 text-ink-300"><use href="#i-chevron-right"/></svg></li>
          <li class="font-semibold text-ink-800">Browse events</li>
        </ol>
      </nav>
      <div class="mt-3 flex flex-wrap items-end justify-between gap-3">
        <h1 class="font-display text-3xl font-extrabold tracking-tight text-ink-900 md:text-4xl">Browse events</h1>
        <p class="text-sm text-ink-500"><span class="font-bold tabular-nums text-ink-800" th:text="${results.totalElements}">1,248</span> events across Iraq</p>
      </div>
    </div>
  </section>

  <!-- ============ STICKY FILTER BAR ============ -->
  <div class="sticky top-16 z-40 border-b border-ink-100 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/80">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3 sm:px-6 lg:px-8">
      <div class="no-scrollbar relative -my-1 flex flex-1 items-center gap-2 overflow-x-auto py-1">
        <a th:href="@{/browse(q=${q},city=${selectedCity},free=${freeOnly})}"
           class="shrink-0 rounded-full border px-4 py-2 text-sm font-medium transition"
           th:classappend="${selectedCategory == ''} ? 'border-brand-500 bg-brand-50 text-brand-700' : 'border-ink-200 bg-white text-ink-700 hover:border-brand-400'">All</a>
        <a th:each="c : ${categories}" th:href="@{/browse(q=${q},category=${c.value},city=${selectedCity},free=${freeOnly})}"
           class="shrink-0 rounded-full border px-4 py-2 text-sm font-medium transition"
           th:classappend="${selectedCategory == c.value} ? 'border-brand-500 bg-brand-50 text-brand-700' : 'border-ink-200 bg-white text-ink-700 hover:border-brand-400'"
           th:text="${c.label}">Music</a>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button id="filtersOpenBtn" class="inline-flex items-center gap-2 rounded-xl border border-ink-200 bg-white px-4 py-2 text-sm font-semibold text-ink-800 transition hover:border-brand-400 hover:text-brand-600 lg:hidden">
          <svg class="h-4 w-4" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg>
          Filters
        </button>
      </div>
    </div>
  </div>

  <!-- ============ SLIDE-OVER FILTER PANEL (mobile/tablet) ============ -->
  <div id="filterOverlay" class="fixed inset-0 z-50 hidden bg-ink-900/50 lg:hidden"></div>
  <aside id="filterPanel" class="fixed inset-y-0 left-0 z-50 w-[85%] max-w-sm -translate-x-full overflow-y-auto bg-white p-6 shadow-cardHover transition-transform duration-300 lg:hidden" aria-label="Filters panel">
    <div class="mb-6 flex items-center justify-between">
      <h2 class="font-display text-lg font-extrabold text-ink-900">Filters</h2>
      <button id="filtersCloseBtn" class="grid h-10 w-10 place-items-center rounded-full border border-ink-200 text-ink-600 transition hover:border-brand-400 hover:text-brand-600" aria-label="Close filters"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <form th:action="@{/browse}" method="get" class="space-y-7">
      <input type="hidden" name="category" th:value="${selectedCategory}">
      <fieldset>
        <legend class="mb-3 text-sm font-bold uppercase tracking-wide text-ink-400">Search</legend>
        <div class="flex items-center gap-2.5 rounded-xl border border-ink-200 bg-ink-50 px-4 py-3">
          <svg class="h-4 w-4 shrink-0 text-ink-400" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="text" name="q" th:value="${q}" class="w-full bg-transparent text-sm outline-none placeholder:text-ink-400" placeholder="Search events…" aria-label="Search events">
        </div>
      </fieldset>
      <fieldset>
        <legend class="mb-3 text-sm font-bold uppercase tracking-wide text-ink-400">City</legend>
        <div class="relative">
          <select name="city" class="w-full cursor-pointer appearance-none rounded-xl border border-ink-200 bg-white py-3 pl-4 pr-9 text-sm font-medium text-ink-700 outline-none transition focus:border-brand-400 focus:ring-4 focus:ring-brand-100" aria-label="Choose city">
            <option value="">All cities</option>
            <option th:each="c : ${cities}" th:value="${c.city}" th:text="${c.city}" th:selected="${selectedCity == c.city}">Baghdad</option>
          </select>
          <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-400" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </div>
      </fieldset>
      <label class="flex cursor-pointer items-center justify-between gap-3 rounded-xl border border-ink-100 bg-ink-50 px-4 py-3 text-sm font-medium text-ink-800">
        Free events only
        <input type="checkbox" name="free" value="true" th:checked="${freeOnly}" class="relative h-5 w-9 cursor-pointer appearance-none rounded-full bg-ink-200 transition before:absolute before:left-0.5 before:top-0.5 before:h-4 before:w-4 before:rounded-full before:bg-white before:transition checked:bg-brand-500 checked:before:translate-x-4" aria-label="Free events only">
      </label>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Apply</button>
        <a th:href="@{/browse}" class="flex-1 rounded-xl border border-ink-200 bg-white px-5 py-3 text-center font-semibold text-ink-800 transition hover:border-brand-400 hover:text-brand-600">Clear</a>
      </div>
    </form>
  </aside>

  <!-- ============ CONTENT ============ -->
  <section class="py-10 md:py-12 lg:py-14">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="grid gap-8 lg:grid-cols-[260px_1fr] lg:gap-10">

        <!-- Desktop sidebar -->
        <aside class="hidden lg:block" aria-label="Filters">
          <form th:action="@{/browse}" method="get" class="sticky top-36 space-y-7 rounded-2xl border border-ink-100 bg-white p-6 shadow-card">
            <input type="hidden" name="category" th:value="${selectedCategory}">
            <fieldset>
              <legend class="mb-3 text-sm font-bold uppercase tracking-wide text-ink-400">Search</legend>
              <div class="flex items-center gap-2.5 rounded-xl border border-ink-200 bg-ink-50 px-4 py-3 transition focus-within:border-brand-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-brand-100">
                <svg class="h-4 w-4 shrink-0 text-ink-400" aria-hidden="true"><use href="#i-search"/></svg>
                <input type="text" name="q" th:value="${q}" class="w-full bg-transparent text-sm outline-none placeholder:text-ink-400" placeholder="Search events…" aria-label="Search events">
              </div>
            </fieldset>
            <hr class="border-ink-100">
            <fieldset>
              <legend class="mb-3 text-sm font-bold uppercase tracking-wide text-ink-400">City</legend>
              <div class="relative">
                <select name="city" class="w-full cursor-pointer appearance-none rounded-xl border border-ink-200 bg-white py-3 pl-4 pr-9 text-sm font-medium text-ink-700 outline-none transition focus:border-brand-400 focus:ring-4 focus:ring-brand-100" aria-label="Choose city">
                  <option value="">All cities</option>
                  <option th:each="c : ${cities}" th:value="${c.city}" th:text="${c.city}" th:selected="${selectedCity == c.city}">Baghdad</option>
                </select>
                <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-400" aria-hidden="true"><use href="#i-chevron-down"/></svg>
              </div>
            </fieldset>
            <hr class="border-ink-100">
            <label class="flex cursor-pointer items-center justify-between gap-3 text-sm font-medium text-ink-800">
              Free events only
              <input type="checkbox" name="free" value="true" th:checked="${freeOnly}" class="relative h-5 w-9 cursor-pointer appearance-none rounded-full bg-ink-200 transition before:absolute before:left-0.5 before:top-0.5 before:h-4 before:w-4 before:rounded-full before:bg-white before:transition checked:bg-brand-500 checked:before:translate-x-4" aria-label="Free events only">
            </label>
            <div class="flex gap-3 pt-1">
              <button type="submit" class="flex-1 rounded-xl bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Apply</button>
              <a th:href="@{/browse}" class="flex-1 rounded-xl border border-ink-200 bg-white px-4 py-2.5 text-center text-sm font-semibold text-ink-800 transition hover:border-brand-400 hover:text-brand-600">Clear</a>
            </div>
          </form>
        </aside>

        <!-- Results -->
        <div>
          <p class="mb-5 text-sm text-ink-500" th:if="${results.totalElements > 0}">Showing <span class="font-bold tabular-nums text-ink-800" th:text="${results.numberOfElements}">9</span> of <span class="font-bold tabular-nums text-ink-800" th:text="${results.totalElements}">1,248</span> events</p>

          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3" th:if="${results.totalElements > 0}">
            <th:block th:each="card : ${results.content}"><a th:replace="~{fragments/layout :: eventCard(${card})}"></a></th:block>
          </div>

          <!-- Empty state -->
          <div th:if="${results.totalElements == 0}" class="flex flex-col items-center rounded-2xl border border-ink-100 bg-ink-50/60 px-6 py-16 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-2xl bg-brand-100 text-brand-600"><svg class="h-7 w-7" aria-hidden="true"><use href="#i-search"/></svg></span>
            <h2 class="mt-5 font-display text-xl font-extrabold text-ink-900">No events match</h2>
            <p class="mt-2 max-w-sm text-sm text-ink-500">Try a different search, another city, or fewer filters.</p>
            <a th:href="@{/browse}" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 text-sm font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Clear filters</a>
          </div>

          <!-- Pagination -->
          <nav class="mt-12 flex items-center justify-center gap-2" aria-label="Pagination" th:if="${results.totalPages > 1}">
            <a th:if="${results.hasPrevious()}"
               th:href="@{/browse(q=${q},category=${selectedCategory},city=${selectedCity},free=${freeOnly},page=${results.number - 1})}"
               class="inline-flex h-10 items-center gap-1.5 rounded-xl border border-ink-200 px-4 text-sm font-semibold text-ink-700 transition hover:border-brand-400 hover:text-brand-600"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-chevron-left"/></svg>Previous</a>
            <span class="grid h-10 min-w-10 place-items-center rounded-xl bg-brand-500 px-3 font-semibold tabular-nums text-white shadow-pop" aria-current="page" th:text="${results.number + 1}">1</span>
            <span class="px-1 text-sm tabular-nums text-ink-400" th:text="'of ' + ${results.totalPages}">of 42</span>
            <a th:if="${results.hasNext()}"
               th:href="@{/browse(q=${q},category=${selectedCategory},city=${selectedCity},free=${freeOnly},page=${results.number + 1})}"
               class="inline-flex h-10 items-center gap-1.5 rounded-xl border border-ink-200 px-4 text-sm font-semibold text-ink-700 transition hover:border-brand-400 hover:text-brand-600">Next<svg class="h-4 w-4" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
          </nav>
        </div>

      </div>
    </div>
  </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
<script>
  // Filters slide-over
  var filterPanel = document.getElementById('filterPanel');
  var filterOverlay = document.getElementById('filterOverlay');
  var openBtn = document.getElementById('filtersOpenBtn');
  var closeBtn = document.getElementById('filtersCloseBtn');
  function openFilters() {
    filterOverlay.classList.remove('hidden');
    filterPanel.classList.remove('-translate-x-full');
    document.body.style.overflow = 'hidden';
  }
  function closeFilters() {
    filterOverlay.classList.add('hidden');
    filterPanel.classList.add('-translate-x-full');
    document.body.style.overflow = '';
  }
  if (openBtn) openBtn.addEventListener('click', openFilters);
  if (closeBtn) closeBtn.addEventListener('click', closeFilters);
  if (filterOverlay) filterOverlay.addEventListener('click', closeFilters);
</script>
</body>
</html>
