<!DOCTYPE html>
<html lang="en" th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org" th:with="pageDescription=#{learn.meta.solutionsDescription}">
<head th:replace="~{fragments/layout :: head(#{learn.title.solutions})}"></head>
<body class="flex min-h-screen flex-col bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('')}"></th:block>
<th:block th:replace="~{fragments/layout :: learnNav('solutions')}"></th:block>

<main id="main" class="type-public flex-1">

  <!-- ============ HERO ============ -->
  <section class="relative overflow-hidden bg-gradient-to-br from-brand-700 via-brand-600 to-indigo-700 text-white">
    <div th:replace="~{fragments/layout :: heroDecor}"></div>
    <div class="relative mx-auto max-w-3xl px-4 py-14 text-center sm:px-6 md:py-20 lg:px-8">
      <span class="inline-block rounded-full bg-white/15 px-4 py-1.5 text-xs font-bold uppercase tracking-wide text-white ring-1 ring-white/25" th:text="#{learn.sol.badge}">Badge</span>
      <h1 class="mt-4 font-display text-3xl font-extrabold tracking-tight md:text-5xl" th:text="#{learn.sol.heroTitle}">Title</h1>
      <p class="mx-auto mt-4 max-w-2xl leading-relaxed text-brand-100" th:text="#{learn.sol.heroSub}">Sub</p>
      <div class="mt-7 flex flex-wrap items-center justify-center gap-2">
        <a th:each="j : ${ { {'conferences','i-briefcase',1}, {'concerts','i-music',2}, {'workshops','i-graduation-cap',3}, {'community','i-heart-handshake',4}, {'bazaars','i-palette',5}, {'sports','i-trophy',6} } }" th:href="'#' + ${j[0]}" class="inline-flex items-center gap-1.5 rounded-full bg-white/15 px-3.5 py-1.5 text-xs font-semibold text-white ring-1 ring-white/25 transition hover:bg-white/25"><svg class="h-3.5 w-3.5" aria-hidden="true"><use th:attr="href='#' + ${j[1]}"/></svg><span th:text="#{${'learn.sol.s' + j[2] + 'Title'}}">Type</span></a>
      </div>
    </div>
  </section>

  <!-- ============ SOLUTIONS ============ -->
  <div class="mx-auto max-w-7xl space-y-16 px-4 py-10 sm:px-6 md:space-y-20 md:py-14 lg:px-8">
    <section th:each="f, it : ${ { {1,'i-briefcase','sol-conference','BUSINESS','conferences','from-brand-500 to-indigo-600','text-brand-600'}, {2,'i-music','sol-concert','MUSIC','concerts','from-fuchsia-500 to-pink-600','text-fuchsia-600'}, {3,'i-graduation-cap','sol-workshop','EDUCATION','workshops','from-emerald-400 to-teal-600','text-emerald-600'}, {4,'i-heart-handshake','sol-community','COMMUNITY','community','from-rose-400 to-orange-500','text-rose-600'}, {5,'i-palette','sol-bazaar','ARTS','bazaars','from-amber-400 to-yellow-500','text-amber-600'}, {6,'i-trophy','sol-sports','SPORTS','sports','from-sky-400 to-cyan-600','text-sky-600'} } }"
             th:id="${f[4]}" class="grid scroll-mt-24 items-center gap-8 lg:grid-cols-2 lg:gap-14">
      <div th:classappend="${it.odd} ? 'lg:order-last' : ''">
        <span class="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br text-white shadow-pop" th:classappend="${f[5]}"><svg class="h-6 w-6" aria-hidden="true"><use th:attr="href='#' + ${f[1]}"/></svg></span>
        <h2 class="mt-4 font-display text-2xl font-extrabold tracking-tight text-ink-900" th:text="#{${'learn.sol.s' + f[0] + 'Title'}}">Solution</h2>
        <p class="mt-2.5 leading-relaxed text-ink-500" th:text="#{${'learn.sol.s' + f[0] + 'Intro'}}">Intro</p>
        <ul class="mt-5 space-y-2.5">
          <li th:each="p : ${#numbers.sequence(1, 3)}" class="flex items-start gap-2.5 text-sm font-medium text-ink-700">
            <svg class="mt-0.5 h-4 w-4 shrink-0" th:classappend="${f[6]}" aria-hidden="true"><use href="#i-circle-check"/></svg>
            <span th:text="#{${'learn.sol.s' + f[0] + 'p' + p}}">Point</span>
          </li>
        </ul>
        <a th:href="@{/browse} + '?category=' + ${f[3]}" class="mt-5 inline-flex items-center gap-1.5 text-sm font-semibold text-brand-600 transition hover:text-brand-700">
          <span th:text="#{${'learn.sol.s' + f[0] + 'Browse'}}">Browse</span>
          <svg class="h-4 w-4 rtl:rotate-180" aria-hidden="true"><use href="#i-arrow-right"/></svg>
        </a>
      </div>
      <div>
        <figure th:replace="~{fragments/layout :: shot(${f[2]}, 1600, 1000, #{${'learn.sol.s' + f[0] + 'Title'}})}"></figure>
      </div>
    </section>
  </div>

  <section th:replace="~{fragments/layout :: ctaBand(#{learn.sol.ctaTitle}, #{learn.sol.ctaSub}, @{/host}, #{learn.sol.ctaBtn}, 'i-rocket', @{/guides/organizers}, #{learn.sol.ctaGuide})}"></section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
