<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saved — iEvent')}"></head>
<body class="bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('saved')}"></th:block>

<main id="main" class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 lg:py-12">

  <h1 class="font-display text-3xl font-extrabold tracking-tight text-ink-900 md:text-4xl">Saved</h1>
  <p class="mt-2 text-ink-500">Events you've hearted, all in one place.</p>

  <!-- ===== Saved grid ===== -->
  <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" th:if="${!events.isEmpty()}">
    <th:block th:each="card : ${events}"><a th:replace="~{fragments/layout :: eventCard(${card})}"></a></th:block>
  </div>

  <!-- ===== Empty state ===== -->
  <div th:if="${events.isEmpty()}" class="mt-10 rounded-2xl border border-dashed border-ink-200 bg-ink-50/60 px-6 py-12 text-center">
    <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-brand-100 text-brand-600"><svg class="h-9 w-9" aria-hidden="true"><use href="#i-heart"/></svg></div>
    <h2 class="mt-4 font-display text-lg font-extrabold tracking-tight text-ink-900">Nothing saved yet</h2>
    <p class="mx-auto mt-1 max-w-xs text-sm text-ink-500">Tap the heart on any event to keep it here for later.</p>
    <a th:href="@{/browse}" class="mt-5 inline-flex min-h-[44px] items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Browse events</a>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
