<!DOCTYPE html>
<html lang="en" th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org" th:with="noIndex=${true}">
<head th:replace="~{fragments/layout :: head(#{public.title.notifications})}"></head>
<body class="flex min-h-screen flex-col bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('')}"></th:block>

<main id="main" class="w-full mx-auto max-w-4xl flex-1 px-4 py-10 sm:px-6 lg:px-8 lg:py-12">

  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-extrabold tracking-tight text-ink-900 md:text-4xl" th:text="#{public.nav.notifications}">Notifications</h1>
      <p class="mt-2 text-ink-500">
        <span th:if="${unread > 0}"><span class="font-semibold tabular-nums text-brand-600" th:text="${unread}">3</span> [[#{public.notif.unreadLine}]]</span>
        <span th:if="${unread == 0}" th:text="#{public.nav.caughtUp}">You're all caught up.</span>
      </p>
    </div>
    <div th:if="${!items.isEmpty()}" class="flex gap-2">
      <form th:if="${unread > 0}" th:action="@{/me/notifications/read-all}" method="post">
        <button type="submit" class="inline-flex items-center gap-1.5 rounded-lg border border-ink-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700 transition hover:border-brand-400 hover:text-brand-600"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#i-check"/></svg>[[#{public.nav.markAllRead}]]</button>
      </form>
      <form th:action="@{/me/notifications/clear}" method="post">
        <button type="submit" class="inline-flex items-center gap-1.5 rounded-lg border border-ink-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700 transition hover:border-rose-300 hover:text-rose-600"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#i-trash-2"/></svg>[[#{public.notif.clearAll}]]</button>
      </form>
    </div>
  </div>

  <!-- ===== List ===== -->
  <ul th:if="${!items.isEmpty()}" class="mt-8 divide-y divide-ink-100 overflow-hidden rounded-2xl border border-ink-100 bg-white shadow-card">
    <li th:each="it : ${items}"
        th:with="tIcon=${it.type() == 'NEW_ORDER'        ? 'i-receipt'
                 : (it.type() == 'ORDER_PENDING'    ? 'i-clock'
                 : (it.type() == 'ORDER_CONFIRMED'  ? 'i-circle-check'
                 : (it.type() == 'ORDER_REJECTED'   ? 'i-x'
                 : (it.type() == 'ORDER_REFUNDED'   ? 'i-banknote'
                 : (it.type() == 'EVENT_CANCELLED'  ? 'i-triangle-alert'
                 : (it.type() == 'EVENT_POSTPONED'  ? 'i-calendar'
                 :                                    'i-bell'))))))},
                 tTile=${it.type() == 'NEW_ORDER'        ? 'bg-brand-100 text-brand-600'
                 : (it.type() == 'ORDER_PENDING'    ? 'bg-amber-100 text-amber-600'
                 : (it.type() == 'ORDER_CONFIRMED'  ? 'bg-green-100 text-green-600'
                 : (it.type() == 'ORDER_REJECTED'   ? 'bg-rose-100 text-rose-600'
                 : (it.type() == 'ORDER_REFUNDED'   ? 'bg-ink-100 text-ink-600'
                 : (it.type() == 'EVENT_CANCELLED'  ? 'bg-rose-100 text-rose-600'
                 : (it.type() == 'EVENT_POSTPONED'  ? 'bg-amber-100 text-amber-600'
                 :                                    'bg-brand-100 text-brand-600'))))))}">
      <a th:href="@{/me/notifications/go/{id}(id=${it.id()})}" class="flex items-start gap-4 px-5 py-4 transition hover:bg-ink-50" th:classappend="${it.unread()} ? 'bg-brand-50/40' : ''">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full" th:classappend="${tTile}"><svg class="h-4 w-4" aria-hidden="true"><use th:attr="href='#'+${tIcon}"/></svg></span>
        <span class="min-w-0 flex-1">
          <span class="flex items-baseline justify-between gap-3">
            <span class="truncate text-sm text-ink-900" th:classappend="${it.unread()} ? 'font-semibold' : 'font-medium'" th:text="${it.title()}">Order confirmed</span>
            <span class="shrink-0 text-xs font-medium text-ink-400" th:text="${it.timeAgo()}">2h ago</span>
          </span>
          <span th:if="${it.body() != ''}" class="mt-0.5 block text-sm leading-relaxed text-ink-500" th:text="${it.body()}">Your tickets for Baghdad Nights are ready.</span>
        </span>
        <span th:if="${it.unread()}" class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-brand-500" aria-hidden="true"></span>
      </a>
    </li>
  </ul>

  <!-- ===== Empty state ===== -->
  <div th:if="${items.isEmpty()}" class="mt-8 rounded-2xl border border-dashed border-ink-200 bg-ink-50/60 px-6 py-14 text-center">
    <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-brand-100 text-brand-600"><svg class="h-9 w-9" aria-hidden="true"><use href="#i-bell"/></svg></div>
    <h2 class="mt-4 font-display text-lg font-extrabold tracking-tight text-ink-900" th:text="#{public.notif.noneYet}">No notifications yet</h2>
    <p class="mx-auto mt-1 max-w-xs text-sm text-ink-500" th:text="#{public.notif.noneYetSub}">Order updates and news from events you follow will land here.</p>
    <a th:href="@{/browse}" class="mt-5 inline-flex min-h-[44px] items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]" th:text="#{public.nav.browse}">Browse events</a>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
