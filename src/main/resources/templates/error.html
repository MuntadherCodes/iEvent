<!DOCTYPE html>
<html lang="en" th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{public.title.error})}"></head>
<body class="flex min-h-screen flex-col bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('')}"></th:block>

<main id="main" class="flex-1">
  <section class="relative overflow-hidden bg-gradient-to-b from-brand-50 to-white">
    <div class="pointer-events-none absolute -start-24 -top-24 h-80 w-80 rounded-full bg-brand-200/50 blur-3xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -end-20 top-32 h-72 w-72 rounded-full bg-fuchsia-200/40 blur-3xl" aria-hidden="true"></div>
    <div class="relative mx-auto max-w-7xl px-4 py-20 sm:px-6 md:py-28 lg:px-8">
      <div class="mx-auto max-w-xl text-center">
        <span class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-brand-100 text-brand-600"><svg class="h-8 w-8" aria-hidden="true"><use href="#i-triangle-alert"/></svg></span>
        <p th:if="${status != null}" class="mt-6 font-display text-sm font-bold uppercase tracking-widest text-brand-600" th:text="#{public.error.errorCode(${'' + status})}">Error 404</p>
        <h1 class="mt-3 font-display text-4xl font-extrabold tracking-tight text-ink-900 sm:text-5xl" th:text="#{public.error.heading}">Something went wrong</h1>
        <p class="mx-auto mt-4 max-w-md text-ink-500" th:text="${status != null and ('' + status) == '429'} ? #{public.error.tooMany} : #{public.error.sub}">The page you're looking for may have moved, sold out, or never existed. Let's get you back to the good stuff.</p>
        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
          <a th:href="@{/}" class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-house"/></svg>[[#{public.error.backHome}]]</a>
          <a th:href="@{/browse}" class="inline-flex items-center gap-2 rounded-xl border border-ink-200 bg-white px-5 py-3 font-semibold text-ink-800 transition hover:border-brand-400 hover:text-brand-600"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-search"/></svg>[[#{public.nav.browse}]]</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
