<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${org.name} + ' — iEvent')}"></head>
<body class="bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('')}"></th:block>

<main id="main">

  <!-- ============ COVER + PROFILE HEAD ============ -->
  <section>
    <div class="relative h-44 overflow-hidden bg-gradient-to-r from-brand-700 via-brand-500 to-fuchsia-500 md:h-56">
      <svg class="absolute inset-0 h-full w-full opacity-15" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="orgcover" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="white"/></pattern></defs><rect width="100%" height="100%" fill="url(#orgcover)"/></svg>
      <div class="pointer-events-none absolute -left-16 -top-16 h-64 w-64 rounded-full bg-white/10 blur-3xl" aria-hidden="true"></div>
      <div class="pointer-events-none absolute -bottom-20 right-10 h-64 w-64 rounded-full bg-brand-950/30 blur-3xl" aria-hidden="true"></div>
    </div>
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="relative -mt-14 flex flex-col gap-5 md:-mt-16 md:flex-row md:items-end md:justify-between">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
          <span class="grid h-28 w-28 shrink-0 place-items-center rounded-full border-4 border-white bg-brand-500 font-display text-3xl font-extrabold text-white shadow-cardHover md:h-32 md:w-32" th:text="${org.initials}">ZE</span>
          <div class="pb-1">
            <h1 class="flex flex-wrap items-center gap-2 font-display text-2xl font-extrabold tracking-tight text-ink-900 md:text-3xl"><span th:text="${org.name}">Zain Events Co.</span><svg th:if="${org.verified}" class="h-6 w-6 text-brand-500" aria-hidden="true"><use href="#i-badge-check"/></svg><span th:if="${org.verified}" class="sr-only">Verified organizer</span></h1>
            <p class="mt-0.5 text-sm font-medium text-ink-500" th:text="'@' + ${org.handle}">@zainevents</p>
            <p class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-ink-600">
              <span class="inline-flex items-center gap-1.5"><svg class="h-4 w-4 text-ink-400" aria-hidden="true"><use href="#i-calendar"/></svg><span class="font-semibold tabular-nums text-ink-900" th:text="${org.eventsHosted}">48</span> events</span>
              <span class="inline-flex items-center gap-1.5"><svg class="h-4 w-4 text-ink-400" aria-hidden="true"><use href="#i-users"/></svg><span class="font-semibold tabular-nums text-ink-900" th:text="${org.followersDisplay}">12.4K</span> followers</span>
              <span th:if="${org.city != null}" class="inline-flex items-center gap-1.5"><svg class="h-4 w-4 text-ink-400" aria-hidden="true"><use href="#i-map-pin"/></svg><span class="font-semibold text-ink-900" th:text="${org.city}">Baghdad</span></span>
            </p>
          </div>
        </div>
        <div class="flex gap-3 pb-1">
          <!-- Follow: signed in → toggle form; signed out → link to login -->
          <form th:if="${currentUser != null}" th:action="@{/organizers/{h}/follow(h=${org.handle})}" method="post">
            <button th:if="${!following}" type="submit" class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]" aria-pressed="false"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-plus"/></svg>Follow</button>
            <button th:if="${following}" type="submit" class="inline-flex items-center gap-2 rounded-xl border border-brand-500 bg-brand-50 px-5 py-3 font-semibold text-brand-700 transition hover:border-brand-600 hover:text-brand-800 active:scale-[.98]" aria-pressed="true"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-check"/></svg>Following</button>
          </form>
          <a th:if="${currentUser == null}" th:href="@{/auth/login}" class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]"><svg class="h-4 w-4" aria-hidden="true"><use href="#i-plus"/></svg>Follow</a>
        </div>
      </div>
      <p th:if="${org.bio != null}" class="mt-6 max-w-2xl text-ink-600" th:text="${org.bio}">Baghdad's leading live-events crew.</p>
    </div>
  </section>

  <!-- ============ UPCOMING EVENTS ============ -->
  <section class="py-10 md:py-12 lg:py-14">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="border-b border-ink-100 pb-3">
        <h2 class="font-display text-xl font-extrabold tracking-tight text-ink-900">Upcoming events</h2>
      </div>

      <div class="grid grid-cols-1 gap-6 pt-8 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" th:if="${!events.isEmpty()}">
        <th:block th:each="card : ${events}"><a th:replace="~{fragments/layout :: eventCard(${card})}"></a></th:block>
      </div>

      <!-- Empty state -->
      <div th:if="${events.isEmpty()}" class="mt-8 rounded-2xl border border-dashed border-ink-200 bg-ink-50/60 px-6 py-12 text-center">
        <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-brand-100 text-brand-600"><svg class="h-9 w-9" aria-hidden="true"><use href="#i-calendar"/></svg></div>
        <h3 class="mt-4 font-display text-lg font-extrabold tracking-tight text-ink-900">No upcoming events</h3>
        <p class="mx-auto mt-1 max-w-xs text-sm text-ink-500">Follow this organizer to hear about their next event first.</p>
        <a th:href="@{/browse}" class="mt-5 inline-flex min-h-[44px] items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Browse all events</a>
      </div>
    </div>
  </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
