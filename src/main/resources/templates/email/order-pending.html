<!DOCTYPE html>
<html th:lang="${mailLang} ?: 'ar'" th:dir="${mailDir} ?: 'rtl'" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f7f7fa;font-family:Arial,Helvetica,sans-serif;color:#23222f;">
<div style="max-width:560px;margin:0 auto;padding:24px 16px;">
  <div style="text-align:center;padding:8px 0 16px;">
    <span dir="ltr" style="font-size:22px;font-weight:800;letter-spacing:.02em;"><span style="color:#8f7ac9;">i</span>Event</span>
  </div>
  <div style="background:#ffffff;border:1px solid #ececf1;border-radius:14px;padding:28px;">
    <h1 style="margin:0 0 6px;font-size:22px;" th:text="#{emails.pending.title}">Order received — one more step</h1>
    <p style="margin:0 0 18px;color:#6b6a80;font-size:14px;">
      <span th:text="#{emails.pending.body1}">We've registered order</span> <strong dir="ltr" th:text="${order.orderCode}">EVT-2026-00000</strong> <span th:text="#{emails.pending.body2}">for</span>
      <strong th:text="${event.title}">the event</strong> (<span th:text="${dateLine}">date</span>).
    </p>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px;font-size:13px;color:#92400e;">
      <span th:text="#{emails.pending.reviewing1}">The organizer is reviewing your transfer of</span> <strong th:text="${totalLabel}">total</strong><span th:text="#{emails.pending.reviewing2}">.
      Your tickets will be issued and emailed as soon as they confirm it — usually within a few hours.</span>
    </div>
    <div style="text-align:center;margin-top:22px;">
      <a th:href="${baseUrl + '/orders/' + order.orderCode}"
         style="display:inline-block;background:#8f7ac9;color:#ffffff;font-weight:700;font-size:14px;padding:12px 26px;border-radius:10px;text-decoration:none;"
         th:text="#{emails.pending.cta}">
        Track my order
      </a>
    </div>
  </div>
  <p style="text-align:center;color:#908fa3;font-size:11px;margin-top:16px;" th:text="#{emails.common.footer}">© 2026 iEvent</p>
</div>
</body>
</html>
