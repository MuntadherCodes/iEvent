<!DOCTYPE html>
<html th:lang="${mailLang} ?: 'ar'" th:dir="${mailDir} ?: 'rtl'" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f7f7fa;font-family:Arial,Helvetica,sans-serif;color:#23222f;">
<div style="max-width:560px;margin:0 auto;padding:24px 16px;">
  <div style="text-align:center;padding:8px 0 16px;">
    <span th:dir="${(mailLang ?: 'ar') == 'en'} ? 'ltr' : 'rtl'" dir="ltr" style="font-size:22px;font-weight:800;letter-spacing:.02em;"><span style="color:#8f7ac9;">i</span><th:block th:if="${(mailLang ?: 'ar') == 'en'}">Event</th:block><span th:unless="${(mailLang ?: 'ar') == 'en'}" style="font-size:1.15em">ايفنت</span></span>
  </div>
  <div style="background:#ffffff;border:1px solid #ececf1;border-radius:14px;padding:28px;">
    <p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8f7ac9;text-transform:uppercase;">
      Support contact form
    </p>
    <table style="width:100%;margin-top:14px;font-size:13px;border-collapse:collapse;">
      <tr>
        <td style="padding:4px 0;color:#908fa3;white-space:nowrap;vertical-align:top;">Name</td>
        <td style="padding:4px 0 4px 10px;color:#23222f;font-weight:600;" th:text="${name}">Jane Doe</td>
      </tr>
      <tr>
        <td style="padding:4px 0;color:#908fa3;white-space:nowrap;vertical-align:top;">Email</td>
        <td style="padding:4px 0 4px 10px;color:#23222f;font-weight:600;" th:text="${fromEmail}">jane@example.com</td>
      </tr>
      <tr th:if="${topic != null and !#strings.isEmpty(topic)}">
        <td style="padding:4px 0;color:#908fa3;white-space:nowrap;vertical-align:top;">Topic</td>
        <td style="padding:4px 0 4px 10px;color:#23222f;font-weight:600;" th:text="${topic}">General</td>
      </tr>
    </table>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid #ececf1;font-size:14px;line-height:1.65;color:#3d3c4f;white-space:pre-line;" th:text="${messageText}">Message body</div>
  </div>
  <p style="text-align:center;color:#908fa3;font-size:11px;margin-top:16px;">Reply-to is set to the sender's address — just hit reply.</p>
</div>
</body>
</html>
