<!DOCTYPE html>
<html th:lang="${mailLang} ?: 'ar'" th:dir="${mailDir} ?: 'rtl'" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f7f7fa;font-family:Arial,Helvetica,sans-serif;color:#23222f;">
<div style="max-width:560px;margin:0 auto;padding:24px 16px;">
  <div style="text-align:center;padding:8px 0 16px;">
    <span th:dir="${(mailLang ?: 'ar') == 'en'} ? 'ltr' : 'rtl'" dir="ltr" style="font-size:22px;font-weight:800;letter-spacing:.02em;"><span style="color:#8f7ac9;">i</span><th:block th:if="${(mailLang ?: 'ar') == 'en'}">Event</th:block><span th:unless="${(mailLang ?: 'ar') == 'en'}" style="font-size:1.15em">ايفنت</span></span>
  </div>
  <div style="background:#ffffff;border:1px solid #ececf1;border-radius:14px;padding:28px;">
    <p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8f7ac9;text-transform:uppercase;"
       th:text="#{emails.campaign.kicker}">
      Update from the organizer
    </p>
    <h1 style="margin:0 0 16px;font-size:20px;" th:text="${eventTitle}">Event</h1>
    <div style="font-size:14px;line-height:1.65;color:#3d3c4f;white-space:pre-line;" th:text="${bodyText}">Message</div>
    <div style="text-align:center;margin-top:22px;">
      <a th:href="${eventUrl}"
         style="display:inline-block;background:#8f7ac9;color:#ffffff;font-weight:700;font-size:14px;padding:12px 26px;border-radius:10px;text-decoration:none;"
         th:text="#{emails.common.viewEvent}">
        View the event
      </a>
    </div>
  </div>
  <p style="text-align:center;color:#908fa3;font-size:11px;margin-top:16px;">
    <span th:text="#{emails.campaign.footer}">© 2026 iEvent · You receive event updates for events you have tickets to.
    Manage preferences from your</span> <a th:href="${baseUrl + '/me/profile'}" style="color:#8f7ac9;" th:text="#{emails.campaign.profileWord}">profile</a>.
  </p>
</div>
</body>
</html>
