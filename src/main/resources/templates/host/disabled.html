<!DOCTYPE html>
<html lang="en" th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org" th:with="noIndex=${true}">
<head th:replace="~{fragments/host-layout :: head(#{host.disabled.title})}"></head>
<body class="bg-white font-body text-ink-800 antialiased">

<header class="border-b border-ink-100 bg-white">
  <div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4 sm:px-6">
    <a th:href="@{/}" class="flex items-center gap-2" th:aria-label="#{host.nav.homeAria}" aria-label="iEvent home">
      <img th:if="${!rtl}" th:src="@{/img/brand-mark-color.png}" alt="" class="h-9 w-auto">
      <span th:if="${!rtl}" class="font-display text-lg font-extrabold tracking-tight text-ink-900"><span class="text-brand-500">i</span>Event</span>
      <img th:if="${rtl}" th:src="@{/img/brand-mark-color-arabic.png}" alt="iEvent" class="h-11 w-auto">
    </a>
    <form th:action="@{/auth/logout}" method="post">
      <button type="submit" class="text-sm font-semibold text-ink-600 transition hover:text-brand-600" th:text="#{host.topbar.signOut}">Sign out</button>
    </form>
  </div>
</header>

<main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-lg flex-col items-center justify-center px-4 py-16 text-center">
  <span class="grid h-16 w-16 place-items-center rounded-2xl bg-rose-100 text-rose-600"><svg class="h-8 w-8" aria-hidden="true"><use href="#i-triangle-alert"/></svg></span>
  <h1 class="mt-6 font-display text-2xl font-extrabold tracking-tight text-ink-900" th:text="#{host.disabled.title}">This account is disabled</h1>
  <p class="mt-3 text-ink-500" th:text="${org.name}">Org name</p>
  <p class="mt-4 leading-relaxed text-ink-500" th:text="#{host.disabled.sub}">This is usually resolved quickly.</p>
  <a th:href="@{/contact}" class="mt-6 inline-flex items-center justify-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">[[#{public.contact.title}]]</a>
</main>

<svg th:replace="~{fragments/layout :: icons}"></svg>
</body>
</html>
