<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/host-layout :: head('Attendees — iEvent Host')}"></head>
<body class="bg-ink-50 font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<div class="flex min-h-screen">

<aside th:replace="~{fragments/host-layout :: sidebar('attendees')}"></aside>

<div class="flex min-w-0 flex-1 flex-col md:pl-20 lg:pl-64">

  <header th:replace="~{fragments/host-layout :: topbar('Attendees')}"></header>

  <main id="main" class="min-w-0 flex-1 px-4 py-6 pb-24 sm:px-6 md:pb-10 lg:px-8">
    <div class="mx-auto max-w-6xl 2xl:max-w-7xl">

      <!-- Page header + controls -->
      <form th:action="@{/host/attendees}" method="get" class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
          <h2 class="font-display text-2xl font-extrabold tracking-tight text-ink-900">Attendees</h2>
          <label class="sr-only" for="event-scope">Event</label>
          <select id="event-scope" name="event" class="rounded-xl border border-ink-200 bg-white px-4 py-2.5 text-sm font-semibold text-ink-800 outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100">
            <option th:each="opt : ${eventOptions}" th:value="${opt.id()}" th:text="${opt.title()}" th:selected="${ev != null && ev.id() == opt.id()}">Baghdad Nights Music Festival</option>
          </select>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div class="relative w-full sm:w-72">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-400" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" name="q" th:value="${q}" placeholder="Search by name or ticket code…" class="w-full rounded-xl border border-ink-200 bg-white py-2.5 pl-10 pr-4 text-sm outline-none placeholder:text-ink-400 focus:border-brand-400 focus:ring-4 focus:ring-brand-100" aria-label="Search attendees">
          </div>
          <button type="submit" class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Search</button>
        </div>
      </form>

      <!-- Empty state -->
      <div th:if="${#lists.isEmpty(rows)}" class="mt-6 rounded-2xl border border-ink-100 bg-white px-6 py-16 text-center shadow-card">
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-brand-50 text-brand-600"><svg class="h-7 w-7" aria-hidden="true"><use href="#i-users"/></svg></span>
        <h3 class="mt-4 font-display text-lg font-bold text-ink-900">No tickets yet</h3>
        <p class="mx-auto mt-1 max-w-sm text-sm text-ink-500">Attendees appear here once orders are confirmed and tickets are issued.</p>
      </div>

      <!-- Attendee table -->
      <div th:unless="${#lists.isEmpty(rows)}" class="relative mt-6 min-w-0 overflow-x-auto rounded-2xl border border-ink-100 bg-white shadow-card">
        <table class="w-full min-w-[760px] text-sm">
          <thead>
            <tr class="border-b border-ink-100 text-left text-xs font-semibold uppercase tracking-wide text-ink-400">
              <th class="px-4 py-3">Name</th>
              <th class="px-3 py-3">Ticket</th>
              <th class="px-3 py-3">Order #</th>
              <th class="px-3 py-3">Code</th>
              <th class="px-3 py-3">Checked in</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${rows}" class="border-b border-ink-50 last:border-0 hover:bg-brand-50/40">
              <td class="px-4 py-3">
                <div class="flex items-center gap-2.5">
                  <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-brand-100 text-xs font-bold text-brand-700" th:text="${#strings.toUpperCase(#strings.substring(r.holderName(), 0, 1))}">A</span>
                  <span class="font-semibold text-ink-900" th:text="${r.holderName()}">Ali Hassan</span>
                </div>
              </td>
              <td class="px-3 py-3"><span class="rounded-full bg-ink-100 px-2.5 py-0.5 text-xs font-semibold text-ink-600" th:text="${r.typeName()}">General Admission</span></td>
              <td class="px-3 py-3 font-mono text-xs tabular-nums text-ink-600" th:text="${r.orderCode()}">EVT-2026-04127</td>
              <td class="px-3 py-3 font-mono text-xs tabular-nums text-ink-500" th:text="${r.code()}">TKT-8841-A</td>
              <td class="px-3 py-3">
                <span th:if="${r.checkedIn()}" class="inline-flex items-center gap-1 text-xs font-semibold text-green-700"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#i-circle-check"/></svg><span th:text="${r.checkedInLine()}">Aug 15 · 7:12 PM</span></span>
                <span th:unless="${r.checkedIn()}" class="text-ink-400">—</span>
              </td>
              <td class="px-4 py-3 text-right">
                <form th:unless="${r.checkedIn()}" th:action="@{/host/tickets/{id}/checkin(id=${r.ticketId()})}" method="post" class="inline">
                  <button type="submit" class="inline-flex items-center gap-1.5 rounded-lg bg-brand-500 px-3.5 py-1.5 text-xs font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#i-check"/></svg>Check in</button>
                </form>
                <form th:if="${r.checkedIn()}" th:action="@{/host/tickets/{id}/undo-checkin(id=${r.ticketId()})}" method="post" class="inline">
                  <button type="submit" class="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-semibold text-ink-500 transition hover:bg-ink-50 hover:text-ink-800">Undo</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <nav th:replace="~{fragments/host-layout :: bottomTabs('attendees')}"></nav>
</div>
</div>

<script>
  var scope = document.getElementById('event-scope');
  if (scope) scope.addEventListener('change', function () { this.form.submit(); });
</script>
</body>
</html>
