<!DOCTYPE html>
<html lang="en" th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org" th:with="pageDescription=#{learn.meta.featuresDescription}">
<head th:replace="~{fragments/layout :: head(#{learn.title.features})}"></head>
<body class="flex min-h-screen flex-col bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('')}"></th:block>
<th:block th:replace="~{fragments/layout :: learnNav('features')}"></th:block>

<main id="main" class="type-public flex-1">

  <!-- ============ HERO ============ -->
  <section class="relative overflow-hidden bg-gradient-to-br from-brand-700 via-brand-600 to-indigo-700 text-white">
    <div th:replace="~{fragments/layout :: heroDecor}"></div>
    <div class="relative mx-auto max-w-3xl px-4 py-14 text-center sm:px-6 md:py-20 lg:px-8">
      <span class="inline-block rounded-full bg-white/15 px-4 py-1.5 text-xs font-bold uppercase tracking-wide text-white ring-1 ring-white/25" th:text="#{learn.feat.badge}">Badge</span>
      <h1 class="mt-4 font-display text-3xl font-extrabold tracking-tight md:text-5xl" th:text="#{learn.feat.heroTitle}">Title</h1>
      <p class="mx-auto mt-4 max-w-2xl leading-relaxed text-brand-100" th:text="#{learn.feat.heroSub}">Sub</p>
    </div>
  </section>

  <!-- ============ FEATURE TOUR ============ -->
  <div class="mx-auto max-w-7xl space-y-16 px-4 py-10 sm:px-6 md:space-y-20 md:py-14 lg:px-8">
    <section th:each="f, it : ${ { {1,'i-sparkles','feat-event',1600,1000,'from-brand-500 to-fuchsia-500','text-brand-600'}, {2,'i-search','feat-discovery',1600,1000,'from-sky-400 to-indigo-600','text-sky-600'}, {3,'i-ticket','feat-ticketing',1600,1000,'from-emerald-400 to-teal-600','text-emerald-600'}, {4,'i-qr-code','feat-checkin',800,1600,'from-amber-400 to-orange-500','text-amber-600'}, {5,'i-pencil','feat-wizard',1600,1000,'from-rose-400 to-pink-600','text-rose-600'}, {6,'i-megaphone','feat-promote',1600,1000,'from-violet-500 to-purple-700','text-violet-600'}, {7,'i-users','feat-team',1600,1000,'from-cyan-400 to-sky-600','text-cyan-600'}, {8,'i-globe','feat-lang',1600,1000,'from-lime-400 to-emerald-600','text-lime-600'} } }"
             class="grid items-center gap-8" th:classappend="${showShots} ? 'lg:grid-cols-2 lg:gap-14' : 'mx-auto max-w-3xl'">
      <div th:classappend="${showShots and it.odd} ? 'lg:order-last' : ''">
        <span class="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br text-white shadow-pop" th:classappend="${f[5]}"><svg class="h-6 w-6" aria-hidden="true"><use th:attr="href='#' + ${f[1]}"/></svg></span>
        <h2 class="mt-4 font-display text-2xl font-extrabold tracking-tight text-ink-900" th:text="#{${'learn.feat.f' + f[0] + 'Title'}}">Feature</h2>
        <p class="mt-2.5 leading-relaxed text-ink-500" th:text="#{${'learn.feat.f' + f[0] + 'Body'}}">Body</p>
        <ul class="mt-5 space-y-2.5">
          <li th:each="b : ${#numbers.sequence(1, 4)}" class="flex items-start gap-2.5 text-sm font-medium text-ink-700">
            <svg class="mt-0.5 h-4 w-4 shrink-0" th:classappend="${f[6]}" aria-hidden="true"><use href="#i-circle-check"/></svg>
            <span th:text="#{${'learn.feat.f' + f[0] + 'b' + b}}">Bullet</span>
          </li>
        </ul>
      </div>
      <div th:if="${showShots}" th:classappend="${f[4] > f[3]} ? 'mx-auto w-full max-w-[300px]' : ''">
        <figure th:replace="~{fragments/layout :: shot(${f[2]}, ${f[3]}, ${f[4]}, #{${'learn.feat.f' + f[0] + 'Title'}})}"></figure>
      </div>
    </section>
  </div>

  <!-- ============ STATS ============ -->
  <section class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <div th:replace="~{fragments/layout :: statStrip}"></div>
  </section>

  <section th:replace="~{fragments/layout :: ctaBand(#{learn.feat.ctaTitle}, #{learn.feat.ctaSub}, @{/host}, #{learn.feat.ctaBtn}, 'i-rocket', @{/pricing}, #{learn.feat.ctaPricing})}"></section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
