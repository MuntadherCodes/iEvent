<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ticket ' + ${t.code} + ' — iEvent')}"></head>
<body class="bg-ink-50 font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-brand-600 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">Skip to content</a>

<!-- Minimal header -->
<header class="border-b border-ink-100 bg-white">
  <div class="mx-auto flex h-16 max-w-7xl items-center px-4 sm:px-6 lg:px-8">
    <a th:href="@{/}" class="flex shrink-0 items-center gap-2" aria-label="iEvent home">
      <img th:src="@{/img/brand-mark-color.png}" alt="" class="h-9 w-auto">
      <span class="font-display text-lg font-extrabold tracking-tight text-ink-900"><span class="text-brand-500">i</span>Event</span>
    </a>
  </div>
</header>

<main id="main" class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md">

    <!-- Status banner -->
    <div th:if="${t.status == 'VALID'}" class="flex items-center gap-3 rounded-t-2xl bg-green-600 px-6 py-4 text-white">
      <svg class="h-6 w-6 shrink-0" aria-hidden="true"><use href="#i-circle-check"/></svg>
      <p class="font-display text-lg font-extrabold">Valid ticket</p>
    </div>
    <div th:if="${t.status == 'CHECKED_IN'}" class="flex items-center gap-3 rounded-t-2xl bg-blue-600 px-6 py-4 text-white">
      <svg class="h-6 w-6 shrink-0" aria-hidden="true"><use href="#i-badge-check"/></svg>
      <div>
        <p class="font-display text-lg font-extrabold">Checked in</p>
        <p th:if="${t.checkedInLine != null}" class="text-sm text-blue-100" th:text="${t.checkedInLine}">Checked in Sat, Sep 12 · 7:14 PM</p>
      </div>
    </div>
    <div th:if="${t.status == 'VOID'}" class="flex items-center gap-3 rounded-t-2xl bg-rose-600 px-6 py-4 text-white">
      <svg class="h-6 w-6 shrink-0" aria-hidden="true"><use href="#i-circle-alert"/></svg>
      <p class="font-display text-lg font-extrabold">Void ticket</p>
    </div>

    <!-- Card body -->
    <div class="rounded-b-2xl border border-t-0 border-ink-100 bg-white p-6 text-center shadow-card sm:p-8">
      <!-- ALLOWED th:utext EXCEPTION: qrSvg is server-generated, safe SVG markup from QrService (never user input). -->
      <div class="qr-box mx-auto h-48 w-48 overflow-hidden rounded-xl border border-ink-100 bg-white p-3" th:utext="${qrSvg}"></div>
      <p class="mt-3 font-mono text-sm font-semibold tracking-widest text-ink-900" th:text="${t.code}">EVT-08451-A</p>

      <div class="mt-6 border-t border-dashed border-ink-200 pt-5 text-left">
        <h1 class="font-display text-lg font-extrabold tracking-tight text-ink-900" th:text="${t.eventTitle}">Baghdad Nights Music Festival</h1>
        <p class="mt-1 flex items-center gap-1.5 text-sm text-ink-500"><svg class="h-4 w-4 shrink-0 text-ink-400" aria-hidden="true"><use href="#i-clock"/></svg><span th:text="${t.dateLine}">Saturday, September 12 · 7:00 PM</span></p>
        <dl class="mt-4 grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
          <div><dt class="text-xs font-semibold uppercase tracking-wide text-ink-400">Ticket type</dt><dd class="mt-0.5 font-semibold text-ink-900" th:text="${t.typeName}">General Admission</dd></div>
          <div><dt class="text-xs font-semibold uppercase tracking-wide text-ink-400">Holder</dt><dd class="mt-0.5 font-semibold text-ink-900" th:text="${t.holderName}">Fahad Al-Thakur</dd></div>
        </dl>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-ink-400">Powered by <a th:href="@{/}" class="font-semibold text-brand-600 transition hover:text-brand-700">iEvent</a></p>
  </div>
</main>

<!-- Minimal footer -->
<footer class="border-t border-ink-100 bg-white">
  <div class="mx-auto flex max-w-7xl items-center justify-center px-4 py-5 text-xs text-ink-400 sm:px-6 lg:px-8">
    <p>© 2026 iEvent. Made with <span class="text-brand-400">♥</span> in Iraq.</p>
  </div>
</footer>

</body>
</html>
