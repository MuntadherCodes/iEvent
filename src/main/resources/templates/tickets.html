<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My tickets — iEvent')}"></head>
<body class="bg-white font-body text-ink-800 antialiased">

<svg th:replace="~{fragments/layout :: icons}"></svg>

<th:block th:replace="~{fragments/layout :: header('tickets')}"></th:block>

<main id="main" class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8 lg:py-12">

  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-extrabold tracking-tight text-ink-900 md:text-4xl">My tickets</h1>
      <p class="mt-2 text-ink-500">All your bookings and RSVPs in one place.</p>
    </div>
    <a th:href="@{/browse}" class="inline-flex min-h-[44px] items-center gap-2 rounded-xl border border-ink-200 bg-white px-5 py-3 font-semibold text-ink-800 transition hover:border-brand-400 hover:text-brand-600">
      <svg class="h-4 w-4" aria-hidden="true"><use href="#i-search"/></svg>Browse events
    </a>
  </div>

  <!-- ===== Ticket groups ===== -->
  <div class="mt-8 space-y-10" th:if="${!groups.isEmpty()}">
    <section th:each="g : ${groups}">
      <div class="mb-4">
        <a th:href="@{/events/{s}(s=${g.eventSlug})}" class="font-display text-xl font-extrabold tracking-tight text-ink-900 transition hover:text-brand-600" th:text="${g.eventTitle}">Baghdad Nights Music Festival</a>
        <p class="mt-1 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-ink-500">
          <span class="inline-flex items-center gap-1.5"><svg class="h-4 w-4 shrink-0 text-ink-400" aria-hidden="true"><use href="#i-clock"/></svg><span th:text="${g.dateLine}">Saturday, September 12 · 7:00 PM</span></span>
          <span class="inline-flex items-center gap-1.5"><svg class="h-4 w-4 shrink-0 text-ink-400" aria-hidden="true"><use href="#i-map-pin"/></svg><span th:text="${g.venueLine}">Al-Zawraa Park, Baghdad</span></span>
        </p>
      </div>
      <div class="space-y-5">
        <th:block th:each="t : ${g.tickets}">
          <div th:replace="~{fragments/layout :: ticketStub(${t}, ${g.eventTitle}, ${g.dateLine}, ${g.venueLine})}"></div>
        </th:block>
      </div>
    </section>
  </div>

  <!-- ===== Empty state ===== -->
  <div th:if="${groups.isEmpty()}" class="mt-10 rounded-2xl border border-dashed border-ink-200 bg-ink-50/60 px-6 py-12 text-center">
    <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-brand-100 text-brand-600"><svg class="h-9 w-9" aria-hidden="true"><use href="#i-ticket"/></svg></div>
    <h2 class="mt-4 font-display text-lg font-extrabold tracking-tight text-ink-900">No tickets yet</h2>
    <p class="mx-auto mt-1 max-w-xs text-sm text-ink-500">When you book or RSVP, your tickets land here automatically.</p>
    <a th:href="@{/browse}" class="mt-5 inline-flex min-h-[44px] items-center gap-2 rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white shadow-pop transition hover:bg-brand-600 active:scale-[.98]">Find your next event</a>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: menuScript}"></script>
</body>
</html>
