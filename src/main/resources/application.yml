spring:
  application:
    name: ievent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ievent}
    username: ${SPRING_DATASOURCE_USERNAME:ievent}
    password: ${SPRING_DATASOURCE_PASSWORD:ievent}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  servlet:
    multipart:
      max-file-size: 6MB
      # Hosts can now pick several cover/gallery photos in one submit (each
      # capped at 3MB app-side) — 8MB only fit one, so this is raised to give
      # room for a real multi-photo gallery plus the rest of the form fields.
      max-request-size: 40MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${MAILJET_API_KEY:}
    password: ${MAILJET_SECRET_KEY:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      # Never let a stalled SMTP connection pin a mail thread forever (ms).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

  # Bounded pool for @Async mail. The default SimpleAsyncTaskExecutor spawns an
  # unbounded thread per email, which under a burst of checkouts is what takes
  # the JVM down rather than a slow mail provider.
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      thread-name-prefix: async-

server:
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    # Boot 3.4.13 caps multipart parts at 50 by default; the event wizard posts
    # ~40 fields plus 5 parts per gallery photo (up to 10 photos).
    max-part-count: 200
    max-part-header-size: 4KB
  servlet:
    session:
      cookie:
        # Lax blocks cross-site POSTs carrying the session (CSRF defence in depth)
        # while still sending the cookie on normal top-level navigations.
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true wherever the site is served over HTTPS
        # (the staging/production compose file does). Off by default so local
        # http://localhost:8080 logins keep working.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    # Signs remember-me cookies. Leave empty to use a random key generated at
    # startup (remember-me sessions then end at every restart); set a long random
    # value in production so they survive deploys.
    remember-me-key: ${REMEMBER_ME_KEY:}
    # Per-IP throttle on login, password reset, admin login, contact, newsletter
    # and checkout POSTs (see RateLimitFilter). Off only for automated test runs.
    rate-limit: ${RATE_LIMIT_ENABLED:true}
  content:
    # Show the product screenshot slots on the learn/content pages. Off until the
    # real screenshots exist in static/img/shots (see the README there).
    screenshots: ${CONTENT_SCREENSHOTS:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    maps-key: ${GOOGLE_MAPS_API_KEY:}
    # GA4 measurement ID (e.g. G-XXXXXXX) — the gtag.js snippet hides when unset.
    analytics-id: ${GA_MEASUREMENT_ID:}
    # Search Console ownership proof via the HTML-tag method — hides when unset.
    site-verification: ${GOOGLE_SITE_VERIFICATION:}
    # Auto-translates event title/summary/description/lineup to the other
    # language on publish (Cloud Translation API v2, API-key auth). Empty
    # means events just display in whichever language the host wrote them.
    translate-api-key: ${GOOGLE_TRANSLATE_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  pexels:
    api-key: ${PEXELS_API_KEY:}
  upload-dir: ${APP_UPLOAD_DIR:/app/data/uploads}
  mail:
    mode: ${MAIL_MODE:mailpit}
    from: ${MAIL_FROM:no-reply@ievent.events}
    support: ${SUPPORT_EMAIL:support@hillool.com}
  seed:
    demo: ${SEED_DEMO:false}
    scale: ${SEED_SCALE:0}
  admin:
    # Super-admin console (/admin) password — a shared operator secret, not a
    # user account. Blank means the console fails closed (no login possible).
    password: ${SUPER_ADMIN_PASSWORD:}
