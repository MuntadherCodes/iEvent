name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & unit/smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ievent
          POSTGRES_USER: ievent
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ievent -d ievent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn verify)
        id: verify
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ievent
          SPRING_DATASOURCE_USERNAME: ievent
          SPRING_DATASOURCE_PASSWORD: ci-test-password
          SEED_DEMO: 'true'
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee mvn-output.log

      - name: Assemble plain-text report
        if: always()
        shell: bash
        run: |
          {
            echo "iEvent CI report — build-test — run ${{ github.run_number }}"
            echo "Commit:  ${{ github.sha }}"
            echo "Date:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Outcome of 'mvn -B verify': ${{ steps.verify.outcome }}"
            echo
            echo "================ Surefire test summary ================"
            if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
              cat target/surefire-reports/*.txt
            else
              echo "(no surefire report files found)"
            fi
            echo
            echo "======== Last 200 lines of build/test output =========="
            if [ -f mvn-output.log ]; then
              tail -n 200 mvn-output.log
            else
              echo "(no maven output captured)"
            fi
          } > report.txt
          echo "---- report.txt preview ----"
          head -n 40 report.txt

      - name: Publish report as release (tag ci-report)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete ci-report --yes || true
          git tag -f ci-report
          git push -f origin ci-report
          gh release create ci-report \
            --title "CI report (build-test) — run ${{ github.run_number }}" \
            --notes-file report.txt

      - name: Upload surefire reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  compose-e2e:
    name: Compose stack & Playwright E2E
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/' .env
          sed -i 's/^SEED_DEMO=.*/SEED_DEMO=true/' .env
          sed -i 's/^SEED_SCALE=.*/SEED_SCALE=300/' .env
          grep -E '^(POSTGRES_PASSWORD|SEED_DEMO|SEED_SCALE)=' .env

      - name: Start the stack
        shell: bash
        run: docker compose up -d --build

      - name: Wait for app health
        shell: bash
        run: |
          echo "Waiting for http://localhost:8080/actuator/health to report UP …"
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "App healthy after $i attempt(s)."
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- still waiting (attempt $i/120) — recent app logs: ---"
              docker compose logs app --tail 50 || true
            fi
            sleep 5
          done
          echo "App never became healthy — full logs follow."
          docker compose logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run Playwright walkthrough
        id: e2e
        shell: bash
        working-directory: e2e
        run: |
          set -o pipefail
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test 2>&1 | tee ../e2e-output.log

      - name: Assemble plain-text report
        if: always()
        shell: bash
        run: |
          {
            echo "iEvent CI report — compose-e2e — run ${{ github.run_number }}"
            echo "Commit:  ${{ github.sha }}"
            echo "Date:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Outcome of Playwright run: ${{ steps.e2e.outcome }}"
            echo
            echo "==================== E2E results ======================"
            if [ -f e2e-output.log ]; then
              cat e2e-output.log
            else
              echo "(no Playwright output captured)"
            fi
            echo
            echo "============ App logs (last 300 lines) ================"
            docker compose logs app --tail 300 || echo "(could not collect app logs)"
          } > report.txt
          echo "---- report.txt preview ----"
          head -n 40 report.txt

      - name: Publish report as release (tag ci-report-compose)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete ci-report-compose --yes || true
          git tag -f ci-report-compose
          git push -f origin ci-report-compose
          gh release create ci-report-compose \
            --title "CI report (compose-e2e) — run ${{ github.run_number }}" \
            --notes-file report.txt
          shopt -s globstar nullglob
          screenshots=(e2e/test-results/**/*.png)
          if [ ${#screenshots[@]} -gt 0 ]; then
            echo "Attaching ${#screenshots[@]} failure screenshot(s) to the release"
            gh release upload ci-report-compose "${screenshots[@]}" --clobber
          else
            echo "No failure screenshots to attach."
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
